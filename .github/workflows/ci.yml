name: CI

on:
  push:
    branches: [main, qa, develop]
  pull_request:
    branches: [main, qa, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  docker-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gr-api-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Arrancar el contenedor y validar /health
        run: |
          docker run -d --name app-smoke \
            -p 4000:4000 \
            -e JWT_SECRET=ci-secreto-de-al-menos-32-caracteres-para-pruebas \
            -e USER_SERVICE_URL=http://localhost:8080 \
            -e WALL_SERVICE_URL=http://localhost:4100 \
            gr-api-gateway:ci

          for i in $(seq 1 15); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/health || true)
            if [ "$status" = "200" ]; then
              echo "Servicio saludable"
              exit 0
            fi
            sleep 2
          done

          echo "El servicio no llego a estar saludable a tiempo"
          docker logs app-smoke
          exit 1

      - name: Logs (si algo fallo)
        if: failure()
        run: docker logs app-smoke || true

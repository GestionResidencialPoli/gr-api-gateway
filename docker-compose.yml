services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gr_user_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - gr_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-microservice:
    build: ../gr-user-microservice
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gr_user_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?falta INTERNAL_SERVICE_TOKEN en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

  wall-migrate:
    build:
      context: ../gr-wall-microservice
      target: migrate
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: gr_wall_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  wall-microservice:
    build: ../gr-wall-microservice
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: gr_wall_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?falta INTERNAL_SERVICE_TOKEN en .env}
      USER_SERVICE_URL: http://user-microservice:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-microservice:
        condition: service_healthy
      wall-migrate:
        condition: service_completed_successfully

  gateway:
    build: .
    environment:
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      USER_SERVICE_URL: http://user-microservice:8080
      WALL_SERVICE_URL: http://wall-microservice:4100
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    depends_on:
      user-microservice:
        condition: service_healthy
      wall-microservice:
        condition: service_healthy

volumes:
  gr_postgres_data:

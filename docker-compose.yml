services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gr_user_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - gr_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-bootstrap:
    image: postgres:16-alpine
    entrypoint: ["sh", "-c"]
    command: ["until pg_isready -h postgres -U $$POSTGRES_USER -d gr_user_db; do sleep 2; done; for db in gr_wall_db gr_booking_db gr_gate_db gr_contact_db gr_billing_db; do PGPASSWORD=$$POSTGRES_PASSWORD createdb -h postgres -U $$POSTGRES_USER $$db 2>/dev/null || true; done"]
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-alpine
    # Docker Desktop en Windows monta el filesystem con permisos que impiden
    # leer .erlang.cookie al usuario rabbitmq. El contenedor no expone el
    # broker fuera de la red de Compose; se ejecuta como root solo en local.
    user: "0:0"
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  user-microservice:
    build: ../gr-user-microservice
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/gr_user_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?falta INTERNAL_SERVICE_TOKEN en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy

  wall-migrate:
    build:
      context: ../gr-wall-microservice
      target: migrate
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: gr_wall_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  wall-microservice:
    build: ../gr-wall-microservice
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: gr_wall_db
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?falta INTERNAL_SERVICE_TOKEN en .env}
      USER_SERVICE_URL: http://user-microservice:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-microservice:
        condition: service_healthy
      wall-migrate:
        condition: service_completed_successfully

  contact-microservice:
    build: ../gr-contact-microservice
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/gr_contact_db
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3006,http://localhost:3007}
      PORT: 4500
    ports:
      - "4500:4500"
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4500/health')"]
      interval: 10s
      timeout: 5s
      retries: 8

  billing-microservice:
    build: ../gr-billing-microservice
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/gr_billing_db
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3006,http://localhost:3007}
      PORT: 4400
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?falta INTERNAL_SERVICE_TOKEN en .env}
    ports:
      - "4400:4400"
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4400/health')"]
      interval: 10s
      timeout: 5s
      retries: 8

  booking-migrate:
    build:
      context: ../gr-booking-microservice
      target: migrate
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: gr_booking_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  booking-microservice:
    build:
      context: ../gr-booking-microservice
      target: runtime
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: gr_booking_db
      RABBITMQ_URL: amqp://rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?falta INTERNAL_SERVICE_TOKEN en .env}
      USER_SERVICE_URL: http://user-microservice:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      rabbitmq:
        condition: service_healthy
      user-microservice:
        condition: service_healthy
      booking-migrate:
        condition: service_completed_successfully

  gate-migrate:
    build:
      context: ../gr-gate-microservice
      target: migrate
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: gr_gate_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  gate-microservice:
    build:
      context: ../gr-gate-microservice
      target: runtime
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: gr_gate_db
      RABBITMQ_URL: amqp://rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?falta INTERNAL_SERVICE_TOKEN en .env}
      USER_SERVICE_URL: http://user-microservice:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      rabbitmq:
        condition: service_healthy
      user-microservice:
        condition: service_healthy
      gate-migrate:
        condition: service_completed_successfully

  gateway:
    build: .
    environment:
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      REDIS_URL: redis://redis:6379
      USER_SERVICE_URL: http://user-microservice:8080
      WALL_SERVICE_URL: http://wall-microservice:4100
      BOOKING_SERVICE_URL: http://booking-microservice:4200
      GATE_SERVICE_URL: http://gate-microservice:4300
      CONTACT_SERVICE_URL: http://contact-microservice:4500
      BILLING_SERVICE_URL: http://billing-microservice:4400
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    depends_on:
      redis:
        condition: service_healthy
      user-microservice:
        condition: service_healthy
      wall-microservice:
        condition: service_healthy
      booking-microservice:
        condition: service_healthy
      gate-microservice:
        condition: service_healthy
      contact-microservice:
        condition: service_healthy
      billing-microservice:
        condition: service_healthy

  public-ui:
    build: ../gr-public-ui
    environment:
      BACKEND_API_URL: http://gateway:4000
    ports:
      - "3006:3006"
    depends_on:
      gateway:
        condition: service_healthy

  billing-ui:
    build: ../gr-billing-ui
    environment:
      BACKEND_API_URL: http://gateway:4000
    ports:
      - "3007:3007"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  gr_postgres_data:
